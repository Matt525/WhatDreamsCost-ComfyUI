name: AmbientCG Phase 1B surfaces

on:
  pull_request:
    paths:
      - ambientcg-trigger.txt
      - tools/ambientcg_surface_transfer.py
      - .github/workflows/ambientcg-surfaces.yml

permissions:
  contents: read

jobs:
  acquire-ambientcg-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download approved AmbientCG surface library
        run: python tools/ambientcg_surface_transfer.py
      - name: Print material manifest summary
        run: |
          python - <<'PY'
          import json
          manifest=json.load(open('ambientcg-transfer/ambientcg-material-manifest.json'))
          for role,item in manifest.items():
              print(role, item['asset_id'], item['resolution'], item['zip_size_mib'], sorted(item['maps']))
          PY
      - name: Upload AmbientCG approval bundle
        uses: actions/upload-artifact@v4
        with:
          name: midnight-district-ambientcg-surfaces
          path: ambientcg-transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package-three-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install exact Three.js runtime
        run: |
          mkdir runtime-build
          cd runtime-build
          npm init -y >/dev/null
          npm install --silent three@0.185.0
          mkdir -p ../three-runtime
          cp node_modules/three/build/three.module.js ../three-runtime/three.module.js
          sha256sum ../three-runtime/three.module.js > ../three-runtime/SHA256SUMS.txt
      - name: Upload Three.js runtime
        uses: actions/upload-artifact@v4
        with:
          name: midnight-district-three-runtime
          path: three-runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
