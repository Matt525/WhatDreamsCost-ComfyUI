name: Phase 1B real asset transfer

on:
  pull_request:
    paths:
      - phase1b-trigger.txt
      - tools/phase1b_asset_transfer.py
      - tools/fix_phase1b_model_dependencies.py
      - tools/phase1b_approval_scene.js
      - .github/workflows/phase1b-asset-transfer.yml

permissions:
  contents: read

jobs:
  acquire-real-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download approved real assets and generate manifest
        run: python tools/phase1b_asset_transfer.py
      - name: Download and verify every glTF dependency
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/fix_phase1b_model_dependencies.py 2>&1 | tee transfer/dependency-log.txt
      - name: Build isolated approval renderer
        id: approval_build
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            rm -rf phase1b-build
            mkdir -p phase1b-build transfer/approval
            cp tools/phase1b_approval_scene.js phase1b-build/
            cd phase1b-build
            npm init -y >/dev/null
            npm install --silent three@0.185.0 esbuild@0.25.0
            npx esbuild phase1b_approval_scene.js --bundle --format=iife --target=es2022 --outfile=../transfer/approval/phase1b-approval.js --minify
            cd ..
            cat > transfer/approval/runtime.json <<'JSON'
          {
            "three": "0.185.0",
            "esbuild": "0.25.0",
            "views": ["covered-car", "apartments", "factory", "materials"],
            "fallback": false
          }
          JSON
          } 2>&1 | tee transfer/approval-build-log.txt
      - name: Print inventory summary
        if: always()
        run: |
          python - <<'PY'
          import json
          items=json.load(open('transfer/asset-inventory.json'))
          for item in items:
              print(item['asset_id'], item['asset_type'], item.get('filename'), item.get('size_mib'), item.get('resolution'))
          PY
      - name: Upload Phase 1B bundle and audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-district-phase1b-assets
          path: transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Enforce dependency success
        if: steps.dependencies.outcome == 'failure'
        run: exit 1
      - name: Enforce approval renderer build success
        if: steps.approval_build.outcome == 'failure'
        run: exit 1
