name: Phase 1B real asset transfer

on:
  pull_request:
    paths:
      - phase1b-trigger.txt
      - tools/phase1b_asset_transfer.py
      - tools/fix_phase1b_model_dependencies.py
      - .github/workflows/phase1b-asset-transfer.yml

permissions:
  contents: read

jobs:
  acquire-real-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download approved real assets and generate manifest
        run: python tools/phase1b_asset_transfer.py
      - name: Download and verify every glTF dependency
        run: python tools/fix_phase1b_model_dependencies.py
      - name: Print inventory summary
        run: |
          python - <<'PY'
          import json
          items=json.load(open('transfer/asset-inventory.json'))
          for item in items:
              print(item['asset_id'], item['asset_type'], item.get('filename'), item.get('size_mib'), item.get('resolution'))
          PY
      - name: Upload Phase 1B bundle
        uses: actions/upload-artifact@v4
        with:
          name: midnight-district-phase1b-assets
          path: transfer
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
